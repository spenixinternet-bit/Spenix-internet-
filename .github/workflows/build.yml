name: Build Android APK

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'

      - name: Create Android project
        run: |
          flutter create --project-name=spenix_internet --platforms=android .
          # Fix Gradle to use a newer version (avoids Kotlin issues)
          cd android
          sed -i 's/gradle-7.6.3/gradle-8.0.2/g' gradle/wrapper/gradle-wrapper.properties
          cd ..

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spenix-app
          path: build/app/outputs/flutter-apk/app-release.apk
